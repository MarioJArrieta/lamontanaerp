# fly.toml app configuration file generated for lamontana-frontend on 2026-03-30T08:01:02-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lamontana-frontend'
primary_region = 'gru'

[build]
  [build.args]
    VITE_API_URL = "https://lamontana-backend.fly.dev/api/v1"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
